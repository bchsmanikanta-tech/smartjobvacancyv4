<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Vacancies | Smart Job Vacancy Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-nav: #ffffff;
            --bg-card: #ffffff;
            --border-card: #e5e9eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --primary-green: #34a87a;
            --primary-green-hover: #2b8c65;
            --primary-green-light: rgba(52, 168, 122, 0.1);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-card: 0 4px 16px rgba(0,0,0,0.05);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-body: #0b111e;
            --bg-nav: #111928;
            --bg-card: #162032;
            --border-card: #222f46;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ---------------- TOP NAVBAR ---------------- */
        .portal-navbar {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border-card);
            padding: 14px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon-box {
            width: 38px;
            height: 38px;
            background: var(--primary-green);
            color: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: var(--font-main);
        }

        .btn-nav-dash {
            background: transparent;
            border: 1px solid var(--primary-green);
            color: var(--primary-green);
        }

        .btn-nav-dash:hover {
            background: var(--primary-green-light);
        }

        .btn-nav-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-card);
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .btn-nav-icon:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .btn-nav-logout {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav-logout:hover {
            background: rgba(239, 68, 68, 0.08);
        }

        /* ---------------- MAIN WORKSPACE ---------------- */
        .portal-content {
            max-width: 1240px;
            width: 100%;
            margin: 0 auto;
            padding: 36px 24px 60px 24px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .page-header-center {
            text-align: center;
            margin-bottom: 8px;
        }

        .page-heading-large {
            font-size: 1.85rem;
            font-weight: 800;
            color: #2ea374;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .page-heading-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ---------------- 3-COLUMN JOB CARDS GRID ---------------- */
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .job-card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
        }

        .job-card-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.08);
        }

        .job-card-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .badge-active-pill {
            background: #2ea374;
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .job-type-label {
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .job-card-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .job-card-meta {
            font-size: 0.82rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }

        .job-card-meta i {
            width: 14px;
            color: var(--text-dim);
            margin-right: 4px;
        }

        .job-card-desc {
            font-size: 0.84rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .job-card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            border-top: 1px solid var(--border-card);
            padding-top: 16px;
        }

        .btn-card-action {
            padding: 7px 4px;
            border-radius: var(--radius-sm);
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: var(--transition);
            background: transparent;
            text-decoration: none;
        }

        .btn-action-applicants {
            border: 1px solid var(--primary-green);
            color: var(--primary-green);
        }

        .btn-action-applicants:hover {
            background: var(--primary-green-light);
        }

        .btn-action-edit {
            border: 1px solid #3b82f6;
            color: #3b82f6;
        }

        .btn-action-edit:hover {
            background: rgba(59, 130, 246, 0.08);
        }

        .btn-action-delete {
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .btn-action-delete:hover {
            background: rgba(239, 68, 68, 0.08);
        }

        /* ---------------- EMPTY STATE ---------------- */
        .empty-grid-state {
            grid-column: 1 / -1;
            padding: 70px 20px;
            text-align: center;
            background: var(--bg-card);
            border: 1px dashed var(--border-card);
            border-radius: var(--radius-lg);
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            color: var(--text-dim);
            margin-bottom: 14px;
            display: block;
        }

        /* ---------------- MODAL POPUP ---------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease forwards;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--primary-green);
        }

        /* ---------------- TOAST ---------------- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .portal-toast {
            background: #1e293b;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.86rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideInToast 0.3s ease;
        }

        @keyframes slideInToast {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 1024px) {
            .jobs-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 680px) {
            .portal-navbar { padding: 12px 16px; }
            .jobs-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <!-- =========================================================
         TOP NAVBAR
         ========================================================= -->
    <header class="portal-navbar">
        <a href="manage-vacancies.html" class="nav-brand">
            <div class="brand-icon-box">
                <i class="fa-solid fa-briefcase"></i>
            </div>
            <span class="brand-title">Manage Vacancies</span>
        </a>

        <div class="nav-actions">
            <a href="company-dashboard.html" class="btn-nav-action btn-nav-dash" id="btn-back-dashboard">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
            <button class="btn-nav-icon" title="Notifications" onclick="showToast('No new notifications.', 'info')">
                <i class="fa-regular fa-bell"></i>
            </button>
            <button class="btn-nav-icon" id="btn-theme-toggle" title="Toggle Theme">
                <i class="fa-regular fa-sun" id="theme-icon"></i>
            </button>
            <button class="btn-nav-logout" id="btn-company-logout" title="Sign Out">
                Logout
            </button>
        </div>
    </header>

    <!-- =========================================================
         MAIN WORKSPACE
         ========================================================= -->
    <main class="portal-content">
        <div class="page-header-center">
            <h1 class="page-heading-large">Manage Posted Vacancies</h1>
            <p class="page-heading-sub">Update information or remove active job listings</p>
        </div>

        <!-- 3-Column Jobs Grid -->
        <div class="jobs-grid" id="manage-jobs-grid">
            <!-- Dynamic Vacancy Cards rendered here -->
        </div>
    </main>

    <!-- =========================================================
         MODAL: EDIT VACANCY
         ========================================================= -->
    <div class="modal-overlay" id="modal-edit-job">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-card); padding-bottom: 12px;">
                <h3 style="font-size: 1.2rem; font-weight: 800; color: var(--text-main);">Edit Job Vacancy</h3>
                <button onclick="closeModal('modal-edit-job')" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted);">&times;</button>
            </div>
            <form id="form-edit-job">
                <input type="hidden" id="edit-job-id">
                <div class="form-group">
                    <label class="form-label">Job Title</label>
                    <input type="text" id="edit-job-title" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Location</label>
                    <input type="text" id="edit-job-location" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Salary Package</label>
                    <input type="text" id="edit-job-salary" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Job Description</label>
                    <textarea id="edit-job-desc" class="form-textarea" rows="4"></textarea>
                </div>
                <button type="submit" style="width: 100%; background: #2ea374; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer;">
                    Update Vacancy Details
                </button>
            </form>
        </div>
    </div>

    <!-- =========================================================
         MODAL: VIEW CANDIDATE APPLICATIONS
         ========================================================= -->
    <div class="modal-overlay" id="modal-view-applicants">
        <div class="modal-card" style="max-width: 900px; width: 95%; max-height: 88vh; padding: 28px 32px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--border-card); padding-bottom: 14px;">
                <div>
                    <h3 style="font-size: 1.3rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-users" style="color: var(--primary-green);"></i> Candidate Applications
                    </h3>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">Review applicant resumes, AI matching scores, and shortlist or reject candidates.</p>
                </div>
                <button class="btn-modal-close" onclick="closeModal('modal-view-applicants')" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted);">&times;</button>
            </div>

            <!-- Filter Buttons -->
            <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
                <button class="btn-action-sm" id="btn-app-filter-all" onclick="filterApplicantsTable('all')" style="padding: 6px 16px; border-radius: 20px; font-weight: 700; background: var(--primary-green); color: #fff; border: none; cursor: pointer;">
                    All Applications (<span id="app-cnt-all">0</span>)
                </button>
                <button class="btn-action-sm" id="btn-app-filter-selected" onclick="filterApplicantsTable('Shortlisted')" style="padding: 6px 16px; border-radius: 20px; font-weight: 700; color: #10b981; border: 1px solid rgba(16,185,129,0.3); background: transparent; cursor: pointer;">
                    <i class="fa-solid fa-star"></i> Shortlisted (<span id="app-cnt-selected">0</span>)
                </button>
                <button class="btn-action-sm" id="btn-app-filter-pending" onclick="filterApplicantsTable('Applied')" style="padding: 6px 16px; border-radius: 20px; font-weight: 700; color: #3b82f6; border: 1px solid rgba(59,130,246,0.3); background: transparent; cursor: pointer;">
                    <i class="fa-solid fa-clock"></i> Under Review (<span id="app-cnt-pending">0</span>)
                </button>
                <button class="btn-action-sm" id="btn-app-filter-rejected" onclick="filterApplicantsTable('Rejected')" style="padding: 6px 16px; border-radius: 20px; font-weight: 700; color: #ef4444; border: 1px solid rgba(239,68,68,0.3); background: transparent; cursor: pointer;">
                    <i class="fa-solid fa-ban"></i> Rejected (<span id="app-cnt-rejected">0</span>)
                </button>
            </div>

            <!-- Table -->
            <div style="overflow-x: auto; max-height: 52vh;">
                <table class="vacancies-table" style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 1px solid var(--border-card); font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase;">
                            <th style="padding: 10px;">Candidate</th>
                            <th style="padding: 10px;">Role Applied</th>
                            <th style="padding: 10px;">Match Score</th>
                            <th style="padding: 10px;">Status</th>
                            <th style="padding: 10px;">Date</th>
                            <th style="padding: 10px;">Screening Action</th>
                        </tr>
                    </thead>
                    <tbody id="applicants-modal-tbody">
                        <!-- Rendered dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/db.js"></script>
    <script>
        let currentEmployerId = '';
        let currentEmployerName = 'BVCITS';
        let currentEmployerEmail = 'employer@smartjob.com';
        let cachedApplicationsList = [];
        let currentApplicantFilter = 'all';

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('session_id') || params.get('id'),
                email: params.get('session_email'),
                name: params.get('session_name'),
                role: params.get('session_role')
            };
        }

        function loadManageJobs() {
            const q = getQueryParams();
            const user = window.auth?.getCurrentUser();
            const role = q.role || user?.role;

            if (role === 'seeker') {
                window.location.replace('seeker-dashboard.html');
                return;
            }

            if (q.id) {
                currentEmployerId = q.id;
            } else if (user) {
                currentEmployerId = user.companyId || user.company_id || user.id || '';
            }

            if (q.name) {
                currentEmployerName = decodeURIComponent(q.name);
            } else if (user) {
                currentEmployerName = user.companyName || user.fullName || user.email.split('@')[0];
            }

            if (q.email) {
                currentEmployerEmail = decodeURIComponent(q.email);
            } else if (user) {
                currentEmployerEmail = user.email;
            }

            // Sync dashboard link
            const dashLink = document.getElementById('btn-back-dashboard');
            if (dashLink) {
                dashLink.href = `company-dashboard.html?session_id=${encodeURIComponent(currentEmployerId)}&session_email=${encodeURIComponent(currentEmployerEmail)}&session_name=${encodeURIComponent(currentEmployerName)}&session_role=company`;
            }

            renderJobsGrid();
            if (window.db && typeof window.db.fetchJobsFromSupabase === 'function') {
                window.db.fetchJobsFromSupabase().then(() => renderJobsGrid());
            }
        }

        function renderJobsGrid() {
            const container = document.getElementById('manage-jobs-grid');
            if (!container || !window.db) return;

            const companyJobs = window.db.getJobsForCompany ? window.db.getJobsForCompany(currentEmployerId, currentEmployerName, currentEmployerEmail) : [];

            if (companyJobs.length === 0) {
                container.innerHTML = `
                    <div class="empty-grid-state">
                        <i class="fa-regular fa-folder-open empty-state-icon"></i>
                        <h3 style="font-size: 1.2rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">No Vacancies Found</h3>
                        <p style="color: var(--text-muted); font-size: 0.86rem; margin-bottom: 20px;">You haven't posted any job vacancies for this company profile yet.</p>
                        <a href="company-dashboard.html" class="btn-nav-action btn-nav-dash" style="background: var(--primary-green); color: #fff; border: none; padding: 10px 22px;">
                            <i class="fa-solid fa-plus"></i> Post a Job Now
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            companyJobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card-box';
                card.innerHTML = `
                    <div>
                        <div class="job-card-top-row">
                            <span class="badge-active-pill">Active</span>
                            <span class="job-type-label">${job.type || 'Full Time'}</span>
                        </div>
                        <h3 class="job-card-title">${job.title}</h3>
                        <div class="job-card-meta">
                            <div><i class="fa-solid fa-location-dot"></i> ${job.location || 'Remote'}</div>
                            <div><i class="fa-solid fa-indian-rupee-sign"></i> Salary: ${job.salary || 'Competitive'}</div>
                        </div>
                        <p class="job-card-desc">${job.description || 'Join our dynamic creative team to design and build stunning web application interfaces.'}</p>
                    </div>
                    <div class="job-card-actions">
                        <button class="btn-card-action btn-action-applicants" onclick="viewJobApplicants('${job.id}')">
                            <i class="fa-solid fa-users"></i> Applicants
                        </button>
                        <button class="btn-card-action btn-action-edit" onclick="openEditModal('${job.id}')">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        <button class="btn-card-action btn-action-delete" onclick="deleteJobVacancy('${job.id}', '${job.title.replace(/'/g, "\\'")}')">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function viewJobApplicants(jobId) {
            const q = getQueryParams();
            const user = window.auth?.getCurrentUser();
            const id = q.id || currentEmployerId;
            const email = q.email || user?.email || currentEmployerEmail;
            const name = q.name || currentEmployerName;
            window.location.href = `job-applicants.html?session_id=${encodeURIComponent(id)}&session_email=${encodeURIComponent(email)}&session_name=${encodeURIComponent(name)}&session_role=company${jobId ? `&jobId=${encodeURIComponent(jobId)}` : ''}`;
        }

        function loadApplicantsModalData(filterJobId = null) {
            let apps = [];
            if (window.db && typeof window.db.getApplicationsForCompany === 'function') {
                apps = window.db.getApplicationsForCompany(currentEmployerId, currentEmployerName, currentEmployerEmail) || [];
            } else if (window.db && typeof window.db.getApplications === 'function') {
                const all = window.db.getApplications() || [];
                apps = all.filter(a => a.company && a.company.toLowerCase() === currentEmployerName.toLowerCase());
            } else {
                const all = JSON.parse(localStorage.getItem('smarthire_applications') || '[]');
                apps = all.filter(a => a.company && a.company.toLowerCase() === currentEmployerName.toLowerCase());
            }

            if (filterJobId) {
                apps = apps.filter(a => String(a.jobId) === String(filterJobId));
            }

            cachedApplicationsList = apps;
            updateApplicantFilterCounts();
            renderApplicantsTable();
        }

        function updateApplicantFilterCounts() {
            const total = cachedApplicationsList.length;
            const selected = cachedApplicationsList.filter(a => a.status === 'Shortlisted' || a.status === 'Hired').length;
            const pending = cachedApplicationsList.filter(a => !a.status || a.status === 'Applied' || a.status === 'Under Review').length;
            const rejected = cachedApplicationsList.filter(a => a.status === 'Rejected').length;

            const cntAll = document.getElementById('app-cnt-all');
            const cntSel = document.getElementById('app-cnt-selected');
            const cntPen = document.getElementById('app-cnt-pending');
            const cntRej = document.getElementById('app-cnt-rejected');

            if (cntAll) cntAll.textContent = total;
            if (cntSel) cntSel.textContent = selected;
            if (cntPen) cntPen.textContent = pending;
            if (cntRej) cntRej.textContent = rejected;
        }

        function filterApplicantsTable(status) {
            currentApplicantFilter = status;

            ['all', 'selected', 'pending', 'rejected'].forEach(tab => {
                const btn = document.getElementById(`btn-app-filter-${tab}`);
                if (!btn) return;
                const match = (tab === 'all' && status === 'all') || 
                              (tab === 'selected' && status === 'Shortlisted') || 
                              (tab === 'pending' && status === 'Applied') || 
                              (tab === 'rejected' && status === 'Rejected');
                if (match) {
                    btn.style.background = tab === 'rejected' ? '#ef4444' : (tab === 'selected' ? '#10b981' : (tab === 'pending' ? '#3b82f6' : 'var(--primary-green)'));
                    btn.style.color = '#fff';
                    btn.style.border = 'none';
                } else {
                    btn.style.background = 'transparent';
                    btn.style.color = tab === 'rejected' ? '#ef4444' : (tab === 'selected' ? '#10b981' : (tab === 'pending' ? '#3b82f6' : 'var(--text-muted)'));
                    btn.style.border = '1px solid var(--border-card)';
                }
            });

            renderApplicantsTable();
        }

        function renderApplicantsTable() {
            const tbody = document.getElementById('applicants-modal-tbody');
            if (!tbody) return;

            let filtered = cachedApplicationsList;
            if (currentApplicantFilter === 'Shortlisted') {
                filtered = filtered.filter(a => a.status === 'Shortlisted' || a.status === 'Hired');
            } else if (currentApplicantFilter === 'Applied') {
                filtered = filtered.filter(a => !a.status || a.status === 'Applied' || a.status === 'Under Review');
            } else if (currentApplicantFilter === 'Rejected') {
                filtered = filtered.filter(a => a.status === 'Rejected');
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-dim); padding: 36px;">
                            <i class="fa-regular fa-folder-open" style="font-size: 2rem; margin-bottom: 8px; display: block;"></i>
                            No candidate applications found in this category.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = '';
            filtered.forEach(app => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid var(--border-card)';
                const isShortlisted = app.status === 'Shortlisted' || app.status === 'Hired';
                const isRejected = app.status === 'Rejected';
                
                let statusBadge = `<span style="background: rgba(59,130,246,0.12); color: #3b82f6; padding: 3px 8px; border-radius: 4px; font-size: 0.74rem; font-weight: 700;">Under Review</span>`;
                if (isShortlisted) {
                    statusBadge = `<span style="background: rgba(16,185,129,0.12); color: #10b981; padding: 3px 8px; border-radius: 4px; font-size: 0.74rem; font-weight: 700;">Shortlisted</span>`;
                } else if (isRejected) {
                    statusBadge = `<span style="background: rgba(239,68,68,0.12); color: #ef4444; padding: 3px 8px; border-radius: 4px; font-size: 0.74rem; font-weight: 700;">Rejected</span>`;
                }

                const matchColor = (app.matchScore || 85) >= 80 ? '#10b981' : '#f59e0b';
                const dateStr = app.appliedAt ? new Date(app.appliedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'Recent';

                tr.innerHTML = `
                    <td style="padding: 12px 10px;">
                        <strong>${app.applicantName || 'Candidate'}</strong>
                        <div style="font-size: 0.74rem; color: var(--text-dim);">${app.applicantEmail || 'candidate@example.com'}</div>
                    </td>
                    <td style="padding: 12px 10px;"><strong style="color: var(--text-main);">${app.jobTitle || 'Senior Developer'}</strong></td>
                    <td style="padding: 12px 10px;"><span style="font-weight: 800; color: ${matchColor};"><i class="fa-solid fa-sparkles"></i> ${app.matchScore || 85}%</span></td>
                    <td style="padding: 12px 10px;">${statusBadge}</td>
                    <td style="padding: 12px 10px; font-size: 0.8rem; color: var(--text-muted);">${dateStr}</td>
                    <td style="padding: 12px 10px;">
                        <div style="display: flex; gap: 6px;">
                            ${!isShortlisted ? `<button class="btn-card-action btn-action-applicants" style="padding: 4px 10px; font-size: 0.72rem;" onclick="setApplicantStatus('${app.id}', 'Shortlisted')"><i class="fa-solid fa-star"></i> Shortlist</button>` : ''}
                            ${!isRejected ? `<button class="btn-card-action btn-action-delete" style="padding: 4px 10px; font-size: 0.72rem;" onclick="setApplicantStatus('${app.id}', 'Rejected')"><i class="fa-solid fa-ban"></i> Reject</button>` : ''}
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function setApplicantStatus(appId, newStatus) {
            const apps = JSON.parse(localStorage.getItem('smarthire_applications') || '[]');
            const idx = apps.findIndex(a => a.id === appId);
            if (idx >= 0) {
                apps[idx].status = newStatus;
                localStorage.setItem('smarthire_applications', JSON.stringify(apps));
                showToast(`Candidate status changed to "${newStatus}"`, newStatus === 'Shortlisted' ? 'success' : 'info');
                loadApplicantsModalData();
            }
        }

        function openEditModal(jobId) {
            const allJobs = window.db?.getJobs() || [];
            const job = allJobs.find(j => j.id === jobId);
            if (!job) return;

            document.getElementById('edit-job-id').value = job.id;
            document.getElementById('edit-job-title').value = job.title;
            document.getElementById('edit-job-location').value = job.location || '';
            document.getElementById('edit-job-salary').value = job.salary || '';
            document.getElementById('edit-job-desc').value = job.description || '';

            document.getElementById('modal-edit-job')?.classList.add('active');
        }

        async function deleteJobVacancy(jobId, jobTitle) {
            if (!confirm(`Are you sure you want to permanently delete vacancy "${jobTitle}"?`)) {
                return;
            }

            if (window.db && typeof window.db.deleteJob === 'function') {
                await window.db.deleteJob(jobId);
            } else {
                let allJobs = window.db?.getJobs() || [];
                allJobs = allJobs.filter(j => String(j.id) !== String(jobId));
                localStorage.setItem('smarthire_jobs', JSON.stringify(allJobs));
            }

            showToast(`Vacancy "${jobTitle}" deleted.`, 'success');
            renderJobsGrid();
        }

        function closeModal(modalId) {
            document.getElementById(modalId)?.classList.remove('active');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'portal-toast';
            let icon = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-info';
            toast.innerHTML = `<i class="${icon}" style="color: ${type === 'success' ? '#10b981' : '#38bdf8'};"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadManageJobs();

            // Handle Edit Job Form Submission
            document.getElementById('form-edit-job')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('edit-job-id').value;
                const title = document.getElementById('edit-job-title').value.trim();
                const location = document.getElementById('edit-job-location').value.trim();
                const salary = document.getElementById('edit-job-salary').value.trim();
                const description = document.getElementById('edit-job-desc').value.trim();

                const updatedFields = {
                    title: title,
                    location: location,
                    salary: salary,
                    description: description
                };

                if (window.db && typeof window.db.updateJob === 'function') {
                    await window.db.updateJob(id, updatedFields);
                } else {
                    const allJobs = window.db?.getJobs() || [];
                    const idx = allJobs.findIndex(j => String(j.id) === String(id));
                    if (idx >= 0) {
                        allJobs[idx] = { ...allJobs[idx], ...updatedFields };
                        localStorage.setItem('smarthire_jobs', JSON.stringify(allJobs));
                    }
                }

                showToast(`Vacancy "${title}" updated successfully!`, 'success');
                closeModal('modal-edit-job');
                renderJobsGrid();
            });

            // Theme Toggle
            const themeBtn = document.getElementById('btn-theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            themeBtn?.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    document.documentElement.removeAttribute('data-theme');
                    themeIcon.className = 'fa-regular fa-sun';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeIcon.className = 'fa-solid fa-moon';
                }
            });

            // Logout
            document.getElementById('btn-company-logout')?.addEventListener('click', () => {
                window.auth?.logout();
            });
        });
    </script>
</body>
</html>
