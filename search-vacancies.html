<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Vacancies | Smart Job Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-nav: #ffffff;
            --bg-card: #ffffff;
            --border-card: #e5e9eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --primary-blue: #3b82f6;
            --btn-blue: #3b66f6;
            --btn-blue-hover: #254ee0;
            --banner-gradient: linear-gradient(135deg, #3b66f6 0%, #14b8a6 100%);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-card: 0 4px 16px rgba(0,0,0,0.05);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-body: #0b111e;
            --bg-nav: #111928;
            --bg-card: #162032;
            --border-card: #222f46;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ---------------- TOP NAVBAR ---------------- */
        .portal-navbar {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border-card);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .brand-logo-pill {
            background: #2563eb;
            color: #fff;
            padding: 4px 14px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            font-family: var(--font-main);
        }

        .btn-nav-dash {
            background: transparent;
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
        }

        .btn-nav-dash:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .btn-nav-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-card);
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .btn-nav-icon:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .btn-nav-logout {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav-logout:hover {
            background: rgba(239, 68, 68, 0.08);
        }

        /* ---------------- HERO SEARCH BANNER ---------------- */
        .hero-search-section {
            background: var(--banner-gradient);
            padding: 50px 24px 60px 24px;
            color: #fff;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
        }

        .hero-search-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .hero-search-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 28px;
        }

        .search-bar-box {
            max-width: 820px;
            width: 100%;
            background: #fff;
            border-radius: 12px;
            padding: 6px;
            display: grid;
            grid-template-columns: 1.2fr 1fr auto;
            gap: 6px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            align-items: center;
        }

        .search-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
        }

        .search-input-wrap i {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .search-field-input {
            width: 100%;
            border: none;
            outline: none;
            font-family: var(--font-main);
            font-size: 0.9rem;
            color: var(--text-main);
            padding: 10px 0;
            background: transparent;
        }

        .search-divider {
            width: 1px;
            height: 28px;
            background: #e2e8f0;
        }

        .btn-gold-search {
            background: #eab308;
            color: #1e293b;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn-gold-search:hover {
            background: #ca8a04;
            transform: translateY(-1px);
        }

        .advanced-filters-toggle {
            margin-top: 14px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .advanced-filters-toggle:hover {
            color: #fff;
        }

        /* ---------------- MAIN VACANCIES CONTENT ---------------- */
        .portal-content {
            max-width: 1240px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px 70px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-heading-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        /* ---------------- 3-COLUMN VACANCY CARDS GRID ---------------- */
        .vacancies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .vacancy-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-md);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-card);
            transition: var(--transition);
        }

        .vacancy-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 26px rgba(0,0,0,0.08);
            border-color: rgba(59, 102, 246, 0.4);
        }

        .card-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .role-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.08);
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .type-pill {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .type-fulltime { background: #2563eb; color: #fff; }
        .type-remote { background: #eab308; color: #1e293b; }
        .type-hybrid { background: #06b6d4; color: #fff; }

        .btn-save-job {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            background: var(--bg-body);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.88rem;
        }

        .btn-save-job:hover {
            background: rgba(245, 158, 11, 0.12);
            color: #d97706;
            border-color: rgba(245, 158, 11, 0.35);
        }

        .btn-save-job.saved {
            background: #fef3c7;
            color: #d97706;
            border-color: #f59e0b;
        }

        .vacancy-title {
            font-size: 1.12rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .vacancy-company {
            font-size: 0.84rem;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 12px;
        }

        .vacancy-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .vacancy-meta i {
            width: 14px;
            color: var(--text-dim);
            margin-right: 4px;
        }

        .btn-view-details {
            width: 100%;
            background: var(--btn-blue);
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-view-details:hover {
            background: var(--btn-blue-hover);
        }

        /* ---------------- DETAILS MODAL ---------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease forwards;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            max-width: 620px;
            width: 100%;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
        }

        /* ---------------- TOAST ---------------- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .portal-toast {
            background: #1e293b;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.86rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideInToast 0.3s ease;
        }

        @keyframes slideInToast {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 1024px) {
            .vacancies-grid { grid-template-columns: repeat(2, 1fr); }
            .search-bar-box { grid-template-columns: 1fr; padding: 12px; }
            .search-divider { display: none; }
        }

        @media (max-width: 680px) {
            .portal-navbar { padding: 12px 16px; }
            .vacancies-grid { grid-template-columns: 1fr; }
            .hero-search-title { font-size: 1.7rem; }
        }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <!-- =========================================================
         TOP NAVBAR
         ========================================================= -->
    <header class="portal-navbar">
        <a href="search-vacancies.html" class="nav-brand">
            <div class="brand-logo-pill">
                <i class="fa-solid fa-briefcase"></i> Smart Job Finder
            </div>
        </a>

        <div class="nav-actions">
            <a href="seeker-dashboard.html" class="btn-nav-action btn-nav-dash" id="btn-back-dashboard">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
            <button class="btn-nav-icon" title="Notifications" onclick="showToast('No new notifications.', 'info')">
                <i class="fa-regular fa-bell"></i>
            </button>
            <button class="btn-nav-icon" id="btn-theme-toggle" title="Toggle Theme">
                <i class="fa-regular fa-sun" id="theme-icon"></i>
            </button>
            <button class="btn-nav-logout" id="btn-portal-logout" title="Sign Out">
                Logout
            </button>
        </div>
    </header>

    <!-- =========================================================
         HERO SEARCH SECTION
         ========================================================= -->
    <section class="hero-search-section">
        <h1 class="hero-search-title">Find Your Dream Job</h1>
        <div class="hero-search-tag">Search thousands of active jobs from top-tier companies</div>

        <div class="search-bar-box">
            <div class="search-input-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="filter-keyword" class="search-field-input" placeholder="Job Title, Skills, or Company" onkeyup="handleFilterSearch()">
            </div>
            <div class="search-divider"></div>
            <div class="search-input-wrap">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" id="filter-location" class="search-field-input" placeholder="City or Remote" onkeyup="handleFilterSearch()">
            </div>
            <button class="btn-gold-search" onclick="handleFilterSearch()">
                <i class="fa-solid fa-magnifying-glass"></i> Search
            </button>
        </div>

        <div class="advanced-filters-toggle" onclick="showToast('Filtering by live active listings.', 'info')">
            <i class="fa-solid fa-sliders"></i> Advanced Filters <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem;"></i>
        </div>
    </section>

    <!-- =========================================================
         MAIN LATEST VACANCIES GRID
         ========================================================= -->
    <main class="portal-content">
        <div class="section-heading-row">
            <h2 class="section-title">Latest Job Vacancies</h2>
        </div>

        <!-- 3-Column Vacancies Grid -->
        <div class="vacancies-grid" id="search-vacancies-grid">
            <!-- Dynamically populated -->
        </div>
    </main>

    <!-- =========================================================
         MODAL: JOB DETAILS & APPLY
         ========================================================= -->
    <div class="modal-overlay" id="modal-job-details">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
                <div>
                    <span id="modal-job-company" style="font-size: 0.8rem; font-weight: 800; color: #2563eb; text-transform: uppercase;">Company</span>
                    <h3 id="modal-job-title" style="font-size: 1.35rem; font-weight: 800; color: var(--text-main); margin-top: 2px;">Job Title</h3>
                </div>
                <button onclick="closeModal('modal-job-details')" style="background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-muted);">&times;</button>
            </div>

            <div style="display: flex; gap: 16px; font-size: 0.84rem; color: var(--text-muted); margin-bottom: 18px;">
                <span><i class="fa-solid fa-location-dot"></i> <span id="modal-job-location">Location</span></span>
                <span><i class="fa-solid fa-wallet"></i> <span id="modal-job-salary">Salary</span></span>
                <span><i class="fa-solid fa-clock"></i> <span id="modal-job-type">Type</span></span>
            </div>

            <div style="margin-bottom: 20px;">
                <h4 style="font-size: 0.88rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Job Description</h4>
                <p id="modal-job-desc" style="font-size: 0.84rem; color: var(--text-muted); line-height: 1.6;">Description goes here...</p>
            </div>

            <input type="hidden" id="modal-job-id">
            <button id="btn-submit-apply" onclick="confirmApplyModal()" class="btn-view-details" style="padding: 13px; font-size: 0.95rem;">
                <i class="fa-solid fa-paper-plane"></i> Apply for this Position
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/db.js"></script>
    <script>
        let currentSeekerName = 'BVCITS';
        let currentSeekerEmail = 'seeker@smartjob.com';
        let allLiveJobs = [];

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                email: params.get('session_email'),
                name: params.get('session_name'),
                role: params.get('session_role')
            };
        }

        function loadSearchVacancies() {
            const q = getQueryParams();
            const user = window.auth?.getCurrentUser();

            if (q.name) currentSeekerName = decodeURIComponent(q.name);
            else if (user) currentSeekerName = user.fullName || user.email.split('@')[0];

            if (q.email) currentSeekerEmail = decodeURIComponent(q.email);
            else if (user) currentSeekerEmail = user.email;

            // Sync dashboard link
            const dashLink = document.getElementById('btn-back-dashboard');
            if (dashLink) {
                dashLink.href = `seeker-dashboard.html?session_email=${encodeURIComponent(currentSeekerEmail)}&session_name=${encodeURIComponent(currentSeekerName)}&session_role=seeker`;
            }

            // Load Jobs & Sync from Supabase
            if (window.db) {
                allLiveJobs = window.db.getJobs() || [];
                renderVacanciesList(allLiveJobs);

                window.db.fetchJobsFromSupabase().then(jobs => {
                    if (jobs && jobs.length > 0) {
                        allLiveJobs = jobs;
                        renderVacanciesList(allLiveJobs);
                    }
                });

                if (typeof window.db.syncSavedJobsFromSupabase === 'function') {
                    window.db.syncSavedJobsFromSupabase(currentSeekerEmail).then(() => {
                        renderVacanciesList(allLiveJobs);
                    });
                }
            }
        }

        function renderVacanciesList(jobs) {
            const container = document.getElementById('search-vacancies-grid');
            if (!container) return;

            if (!jobs || jobs.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; padding: 60px 20px; text-align: center; color: var(--text-dim); background: var(--bg-card); border: 1px dashed var(--border-card); border-radius: 14px;">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 2.6rem; color: #cbd5e1; margin-bottom: 12px; display: block;"></i>
                        <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--text-main);">No Vacancies Match Your Search</h3>
                        <p style="font-size: 0.84rem; color: var(--text-muted); margin-top: 4px;">Try searching for other skills like "React", "Python", or locations.</p>
                    </div>
                `;
                return;
            }

            const savedJobIds = getSavedJobIds();

            container.innerHTML = '';
            jobs.forEach(j => {
                const card = document.createElement('div');
                card.className = 'vacancy-card';

                const isSaved = savedJobIds.includes(String(j.id));

                // Determine icon & type badge
                let icon = '<i class="fa-solid fa-code"></i>';
                if (j.title.toLowerCase().includes('data') || j.title.toLowerCase().includes('analyst')) icon = '<i class="fa-solid fa-chart-simple"></i>';
                else if (j.title.toLowerCase().includes('ui') || j.title.toLowerCase().includes('design') || j.title.toLowerCase().includes('frontend')) icon = '<i class="fa-solid fa-palette"></i>';
                else if (j.title.toLowerCase().includes('security')) icon = '<i class="fa-solid fa-shield-halved"></i>';

                let typeClass = 'type-fulltime';
                let typeLabel = j.type || 'Full Time';
                if (typeLabel.toLowerCase().includes('remote')) typeClass = 'type-remote';
                else if (typeLabel.toLowerCase().includes('hybrid') || typeLabel.toLowerCase().includes('part')) typeClass = 'type-hybrid';

                card.innerHTML = `
                    <div>
                        <div class="card-top-header">
                            <div class="role-icon-box">${icon}</div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="type-pill ${typeClass}">${typeLabel}</span>
                                <button class="btn-save-job ${isSaved ? 'saved' : ''}" onclick="toggleSaveJob(event, '${j.id}')" title="${isSaved ? 'Remove from Saved' : 'Save Job'}">
                                    <i class="${isSaved ? 'fa-solid' : 'fa-regular'} fa-bookmark"></i>
                                </button>
                            </div>
                        </div>
                        <h3 class="vacancy-title">${j.title}</h3>
                        <div class="vacancy-company">${j.company || 'TechCorp Solutions'}</div>
                        <div class="vacancy-meta">
                            <div><i class="fa-solid fa-location-dot"></i> ${j.location || 'Bangalore, India'}</div>
                            <div><i class="fa-solid fa-indian-rupee-sign"></i> Salary: ${j.salary || '₹18 - ₹25 LPA'}</div>
                        </div>
                    </div>
                    <button class="btn-view-details" onclick="openJobDetailsModal('${j.id}')">
                        View Details
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function getSavedJobIds() {
            if (window.db && typeof window.db.getSavedJobs === 'function') {
                return window.db.getSavedJobs();
            }
            try {
                return JSON.parse(localStorage.getItem('smartjob_saved_jobs') || '[]');
            } catch (e) {
                return [];
            }
        }

        async function toggleSaveJob(event, jobId) {
            if (event) event.stopPropagation();

            let saved = getSavedJobIds();
            const idStr = String(jobId);
            const jobData = allLiveJobs.find(j => String(j.id) === idStr);

            if (saved.includes(idStr)) {
                if (window.db && typeof window.db.removeSavedJobCloud === 'function') {
                    await window.db.removeSavedJobCloud(idStr, currentSeekerEmail);
                } else {
                    saved = saved.filter(id => id !== idStr);
                    localStorage.setItem('smartjob_saved_jobs', JSON.stringify(saved));
                }
                showToast('Job removed from Saved list.', 'info');
            } else {
                if (window.db && typeof window.db.saveJobCloud === 'function') {
                    await window.db.saveJobCloud(idStr, jobData, currentSeekerEmail);
                } else {
                    saved.push(idStr);
                    localStorage.setItem('smartjob_saved_jobs', JSON.stringify(saved));
                }
                showToast('Job saved & synced to Supabase database!', 'success');
            }

            renderVacanciesList(allLiveJobs);
        }

        function handleFilterSearch() {
            const keyword = document.getElementById('filter-keyword')?.value.toLowerCase().trim() || '';
            const location = document.getElementById('filter-location')?.value.toLowerCase().trim() || '';

            const filtered = allLiveJobs.filter(j => {
                const matchKey = !keyword || 
                    j.title.toLowerCase().includes(keyword) || 
                    (j.company && j.company.toLowerCase().includes(keyword)) ||
                    (Array.isArray(j.skills) && j.skills.some(s => s.toLowerCase().includes(keyword)));
                
                const matchLoc = !location || (j.location && j.location.toLowerCase().includes(location));
                return matchKey && matchLoc;
            });

            renderVacanciesList(filtered);
        }

        function openJobDetailsModal(jobId) {
            const q = getQueryParams();
            const user = window.auth?.getCurrentUser();
            const email = q.email || user?.email || currentSeekerEmail;
            const name = q.name || currentSeekerName;
            window.location.href = `job-details.html?id=${encodeURIComponent(jobId)}&session_email=${encodeURIComponent(email)}&session_name=${encodeURIComponent(name)}&session_role=seeker`;
        }

        async function applyForVacancyModal(jobId) {
            const job = allLiveJobs.find(j => String(j.id) === String(jobId));
            if (!job) return;

            const allApps = window.db ? window.db.getApplications() : JSON.parse(localStorage.getItem('smarthire_applications') || '[]');
            
            // Check if already applied
            const exists = allApps.some(a => String(a.jobId) === String(jobId) && (a.applicantEmail || a.email)?.toLowerCase() === currentSeekerEmail.toLowerCase());
            if (exists) {
                showToast('You have already applied for this vacancy.', 'info');
                closeModal('modal-job-details');
                return;
            }

            const newApp = {
                id: 'app_' + Date.now(),
                jobId: jobId,
                jobTitle: job.title,
                company: job.company || 'TechCorp Solutions',
                applicantName: currentSeekerName,
                fullName: currentSeekerName,
                applicantEmail: currentSeekerEmail,
                email: currentSeekerEmail,
                matchScore: Math.floor(Math.random() * 12) + 88,
                status: 'Applied',
                appliedAt: new Date().toISOString()
            };

            if (window.db && typeof window.db.saveApplication === 'function') {
                await window.db.saveApplication(newApp);
            } else {
                allApps.unshift(newApp);
                localStorage.setItem('smarthire_applications', JSON.stringify(allApps));
            }

            showToast(`🎉 Application successfully submitted for "${job.title}"!`, 'success');
            closeModal('modal-job-details');
        }

        function closeModal(modalId) {
            document.getElementById(modalId)?.classList.remove('active');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'portal-toast';
            let icon = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-info';
            toast.innerHTML = `<i class="${icon}" style="color: ${type === 'success' ? '#10b981' : '#38bdf8'};"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSearchVacancies();

            // Theme Toggle
            const themeBtn = document.getElementById('btn-theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            themeBtn?.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    document.documentElement.removeAttribute('data-theme');
                    themeIcon.className = 'fa-regular fa-sun';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeIcon.className = 'fa-solid fa-moon';
                }
            });

            // Logout
            document.getElementById('btn-portal-logout')?.addEventListener('click', () => {
                window.auth?.logout();
            });
        });
    </script>
</body>
</html>
