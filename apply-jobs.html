<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form | Smart Job Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-nav: #ffffff;
            --bg-card: #ffffff;
            --border-card: #e5e9eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --primary-blue: #3b82f6;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-card: 0 10px 30px rgba(0,0,0,0.06);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-body: #0b111e;
            --bg-nav: #111928;
            --bg-card: #162032;
            --border-card: #222f46;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ---------------- TOP NAVBAR ---------------- */
        .portal-navbar {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border-card);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 800;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav-cancel {
            background: transparent;
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
            padding: 7px 18px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav-cancel:hover {
            background: rgba(59, 130, 246, 0.08);
        }

        .btn-nav-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-card);
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .btn-nav-logout {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav-logout:hover {
            background: rgba(239, 68, 68, 0.08);
        }

        /* ---------------- MAIN FORM CARD CONTAINER ---------------- */
        .portal-content {
            max-width: 680px;
            width: 100%;
            margin: 40px auto 80px auto;
            padding: 0 20px;
        }

        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 38px 42px;
            box-shadow: var(--shadow-card);
        }

        .form-header-center {
            text-align: center;
            margin-bottom: 24px;
        }

        .form-title-main {
            font-size: 1.65rem;
            font-weight: 800;
            color: #3b82f6;
            margin-bottom: 4px;
        }

        .form-subtitle-sub {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        .form-divider {
            height: 1px;
            background: var(--border-card);
            margin: 18px 0 24px 0;
        }

        /* ---------------- FORM CONTROLS ---------------- */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .form-input[readonly] {
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-muted);
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .radio-group-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 6px;
            font-size: 0.86rem;
            font-weight: 600;
        }

        .radio-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .file-upload-box {
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            background: var(--bg-card);
            display: flex;
            align-items: center;
        }

        .form-helper {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-top: 4px;
            display: block;
        }

        .btn-submit-app {
            background: #1e293b;
            color: #fff;
            border: none;
            padding: 13px 28px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 28px auto 0 auto;
            transition: var(--transition);
        }

        .btn-submit-app:hover {
            background: #0f172a;
            transform: translateY(-1px);
        }

        /* ---------------- TOAST ---------------- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .portal-toast {
            background: #1e293b;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.86rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideInToast 0.3s ease;
        }

        @keyframes slideInToast {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 680px) {
            .portal-navbar { padding: 12px 16px; }
            .form-card { padding: 24px 20px; }
            .form-row-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <!-- =========================================================
         TOP NAVBAR
         ========================================================= -->
    <header class="portal-navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-paper-plane" style="color: var(--primary-blue);"></i> Job Application
        </div>

        <div class="nav-actions">
            <a href="search-vacancies.html" class="btn-nav-cancel" id="btn-cancel-app">
                <i class="fa-solid fa-arrow-left"></i> Cancel
            </a>
            <button class="btn-nav-icon" title="Notifications" onclick="showToast('No new notifications.', 'info')">
                <i class="fa-regular fa-bell"></i>
            </button>
            <button class="btn-nav-icon" id="btn-theme-toggle" title="Toggle Theme">
                <i class="fa-regular fa-sun" id="theme-icon"></i>
            </button>
            <button class="btn-nav-logout" id="btn-portal-logout" title="Sign Out">
                Logout
            </button>
        </div>
    </header>

    <!-- =========================================================
         MAIN APPLICATION FORM CARD
         ========================================================= -->
    <main class="portal-content">
        <div class="form-card">
            
            <div class="form-header-center">
                <h1 class="form-title-main">Job Application Form</h1>
                <p class="form-subtitle-sub">Provide details below to submit your candidature</p>
                <div class="form-divider"></div>
            </div>

            <form id="form-job-application">
                
                <!-- Job Title -->
                <div class="form-group">
                    <label class="form-label">Job Title</label>
                    <input type="text" id="app-job-title" class="form-input" value="Frontend UI/UX Architect" readonly>
                </div>

                <!-- Full Name + Email Address -->
                <div class="form-row-2">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="app-full-name" class="form-input" value="BVCITS" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="app-email-address" class="form-input" value="mrmaheshbabu222@gmail.com" readonly>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" id="app-phone" class="form-input" value="+91 9999988888" placeholder="+91 9999988888" required>
                </div>

                <!-- Address -->
                <div class="form-group">
                    <label class="form-label">Address</label>
                    <input type="text" id="app-address" class="form-input" placeholder="Flat, House no., Building, Street">
                </div>

                <!-- City + State -->
                <div class="form-row-2">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">City</label>
                        <input type="text" id="app-city" class="form-input" placeholder="e.g. Hyderabad">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">State</label>
                        <input type="text" id="app-state" class="form-input" placeholder="e.g. Telangana">
                    </div>
                </div>

                <!-- CGPA + Highest Qualification -->
                <div class="form-row-2">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">CGPA</label>
                        <input type="text" id="app-cgpa" class="form-input" placeholder="e.g., 8.5">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Highest Qualification</label>
                        <select id="app-qualification" class="form-select">
                            <option value="">Select highest degree...</option>
                            <option value="B.Tech / B.E." selected>B.Tech / B.E.</option>
                            <option value="M.Tech / M.E.">M.Tech / M.E.</option>
                            <option value="BCA / MCA">BCA / MCA</option>
                            <option value="B.Sc / M.Sc">B.Sc / M.Sc</option>
                            <option value="MBA">MBA</option>
                            <option value="Diploma / Other">Diploma / Other</option>
                        </select>
                    </div>
                </div>

                <!-- Years of Experience + Expected Salary -->
                <div class="form-row-2">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Years of Experience</label>
                        <input type="text" id="app-experience" class="form-input" placeholder="e.g., 2.5">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Expected Salary (LPA)</label>
                        <input type="text" id="app-salary" class="form-input" placeholder="e.g., 8.5">
                    </div>
                </div>

                <!-- Certification Radio -->
                <div class="form-group">
                    <label class="form-label">Do you have a Certification?</label>
                    <div class="radio-group-row">
                        <label class="radio-label">
                            <input type="radio" name="has_certification" value="yes"> Yes
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="has_certification" value="no" checked> No
                        </label>
                    </div>
                </div>

                <!-- Upload Resume -->
                <div class="form-group">
                    <label class="form-label">Upload Application Resume</label>
                    <div class="file-upload-box">
                        <input type="file" id="app-resume-file" style="font-size: 0.84rem;">
                    </div>
                    <small class="form-helper">Accepted formats: PDF, DOC, DOCX. Max size: 5MB.</small>
                </div>

                <!-- Cover Letter -->
                <div class="form-group">
                    <label class="form-label">Cover Letter</label>
                    <textarea id="app-cover-letter" class="form-textarea" rows="4" placeholder="Write briefly why you are a good fit for this role..."></textarea>
                </div>

                <input type="hidden" id="app-hidden-jobid">
                <input type="hidden" id="app-hidden-company">

                <!-- Submit Button -->
                <button type="submit" class="btn-submit-app">
                    <i class="fa-solid fa-circle-check"></i> Submit Application
                </button>
            </form>

        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/db.js"></script>
    <script>
        let currentSeekerName = 'BVCITS';
        let currentSeekerEmail = 'mrmaheshbabu222@gmail.com';
        let targetJob = null;

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                jobId: params.get('jobId') || params.get('id'),
                email: params.get('session_email'),
                name: params.get('session_name'),
                role: params.get('session_role')
            };
        }

        function loadApplicationForm() {
            const q = getQueryParams();
            const user = window.auth?.getCurrentUser();

            if (q.name) currentSeekerName = decodeURIComponent(q.name);
            else if (user) currentSeekerName = user.fullName || user.email.split('@')[0];

            if (q.email) currentSeekerEmail = decodeURIComponent(q.email);
            else if (user) currentSeekerEmail = user.email;

            // Prefill Seeker fields
            document.getElementById('app-full-name').value = currentSeekerName;
            document.getElementById('app-email-address').value = currentSeekerEmail;

            // Prefill from profile if available
            const profile = window.db?.getSeekerProfile ? window.db.getSeekerProfile(currentSeekerEmail) : null;
            if (profile) {
                if (profile.fullName && !currentSeekerName) {
                    currentSeekerName = profile.fullName;
                    document.getElementById('app-full-name').value = currentSeekerName;
                }
                if (profile.phone) document.getElementById('app-phone').value = profile.phone;
                if (profile.location) document.getElementById('app-city').value = profile.location;
                if (profile.qualification && document.getElementById('app-qualification')) {
                    document.getElementById('app-qualification').value = profile.qualification;
                }
            }

            // Load Job details
            const allJobs = window.db?.getJobs() || [];
            const jobId = q.jobId;

            if (jobId) {
                targetJob = allJobs.find(j => j.id === jobId);
            }

            if (!targetJob) {
                targetJob = allJobs[0] || {
                    id: 'job_seed_2',
                    title: 'Frontend UI/UX Architect',
                    company: 'InnovateX Labs'
                };
            }

            document.getElementById('app-job-title').value = targetJob.title;
            document.getElementById('app-hidden-jobid').value = targetJob.id;
            document.getElementById('app-hidden-company').value = targetJob.company || 'InnovateX Labs';

            // Check if already applied
            if (window.db?.hasCandidateApplied && window.db.hasCandidateApplied(targetJob.id, currentSeekerEmail)) {
                showToast(`Notice: You have already applied for "${targetJob.title}"`, 'warning');
                const submitBtn = document.getElementById('btn-submit-application');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.style.opacity = '0.6';
                    submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Already Applied';
                }
            }

            // Cancel link
            const cancelBtn = document.getElementById('btn-cancel-app');
            if (cancelBtn) {
                cancelBtn.href = `job-details.html?id=${encodeURIComponent(targetJob.id)}&session_email=${encodeURIComponent(currentSeekerEmail)}&session_name=${encodeURIComponent(currentSeekerName)}&session_role=seeker`;
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'portal-toast';
            let icon = type === 'success' ? 'fa-solid fa-circle-check' : (type === 'warning' ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-circle-info');
            let iconColor = type === 'success' ? '#10b981' : (type === 'warning' ? '#f59e0b' : '#38bdf8');
            toast.innerHTML = `<i class="${icon}" style="color: ${iconColor};"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadApplicationForm();

            // Submit Form
            document.getElementById('form-job-application')?.addEventListener('submit', async (e) => {
                e.preventDefault();

                const fullName = document.getElementById('app-full-name').value.trim();
                const email = document.getElementById('app-email-address').value.trim();
                const phone = document.getElementById('app-phone').value.trim();
                const city = document.getElementById('app-city').value.trim();
                const qualification = document.getElementById('app-qualification').value;
                const experience = document.getElementById('app-experience').value;
                const coverLetter = document.getElementById('app-cover-letter').value.trim();
                const jobId = document.getElementById('app-hidden-jobid').value;
                const jobTitle = document.getElementById('app-job-title').value;
                const company = document.getElementById('app-hidden-company').value;

                // Prevent duplicate application
                if (window.db?.hasCandidateApplied && window.db.hasCandidateApplied(jobId, email)) {
                    showToast(`You have already submitted an application for "${jobTitle}"!`, 'warning');
                    return;
                }

                const user = window.auth?.getCurrentUser();
                const candidateId = user?.id || '';
                const appId = window.db?.generateUUID ? window.db.generateUUID() : ('app_' + Date.now());

                const newAppData = {
                    id: appId,
                    jobId: jobId,
                    job_id: jobId,
                    companyId: targetJob?.companyId || targetJob?.company_id || '',
                    company_id: targetJob?.companyId || targetJob?.company_id || '',
                    companyEmail: targetJob?.companyEmail || '',
                    candidateId: candidateId,
                    candidate_id: candidateId,
                    jobTitle: jobTitle,
                    company: company,
                    fullName: fullName,
                    applicantName: fullName,
                    email: email,
                    applicantEmail: email,
                    phone: phone,
                    city: city,
                    location: city,
                    qualification: qualification,
                    experience: experience,
                    coverLetter: coverLetter,
                    matchScore: Math.floor(Math.random() * 10) + 88,
                    status: 'Applied',
                    appliedAt: new Date().toISOString()
                };

                if (window.db && typeof window.db.saveApplication === 'function') {
                    await window.db.saveApplication(newAppData);
                } else {
                    const allApps = JSON.parse(localStorage.getItem('smarthire_applications') || '[]');
                    allApps.unshift(newAppData);
                    localStorage.setItem('smarthire_applications', JSON.stringify(allApps));
                }

                showToast(`🎉 Application successfully submitted for "${jobTitle}"!`, 'success');

                setTimeout(() => {
                    window.location.href = `seeker-dashboard.html?session_email=${encodeURIComponent(email)}&session_name=${encodeURIComponent(fullName)}&session_role=seeker`;
                }, 1200);
            });

            // Theme Toggle
            const themeBtn = document.getElementById('btn-theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            themeBtn?.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    document.documentElement.removeAttribute('data-theme');
                    themeIcon.className = 'fa-regular fa-sun';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeIcon.className = 'fa-solid fa-moon';
                }
            });

            // Logout
            document.getElementById('btn-portal-logout')?.addEventListener('click', () => {
                window.auth?.logout();
            });
        });
    </script>
</body>
</html>
